[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-bangla-token-analysis"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pandas>=2.1,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
